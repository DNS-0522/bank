<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F0E0E">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="愛情銀行">
<title>愛情銀行</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F0E0E;
    --panel: #161413;
    --panel-2: #1D1A19;
    --line: #2A2523;
    --rose: #E2B4A0;      /* 玫瑰金:文字與重點 */
    --copper: #B98672;    /* 玫瑰金:細線與外框 */
    --text: #F2ECE8;
    --dim: #CFC6C0;
    --muted: #8F8580;
    --serif: "Cormorant Garamond", "Noto Serif TC", "Songti TC", "PMingLiU", serif;
    --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, -apple-system, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--sans); font-weight: 400; background: var(--bg); color: var(--text);
    min-height: 100vh; min-height: 100dvh; -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { cursor: default; }
  :focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; }
  .ic { display: block; flex: none; }

  .screen {
    max-width: 480px; margin: 0 auto; min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column;
    background: linear-gradient(180deg, #1B1716 0, var(--bg) 340px) no-repeat;
  }
  .page { flex: 1; padding-bottom: calc(92px + env(safe-area-inset-bottom, 0px)); }

  /* ---------- 上方列與問候 ---------- */
  .topbar {
    display: flex; justify-content: space-between; align-items: center; min-height: 44px;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 20px 6px;
  }
  .top-title { font-family: var(--serif); font-weight: 600; font-size: 22px; letter-spacing: .06em; color: var(--rose); }
  .top-actions { display: flex; gap: 10px; margin-left: auto; }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
    border: 1px solid var(--line); background: rgba(255, 255, 255, .02); color: var(--rose);
  }
  .icon-btn:active { background: var(--panel-2); }

  .hello { padding: 4px 22px 0; }
  .gm { font-size: 12px; letter-spacing: .2em; color: var(--copper); }
  .hi { font-family: var(--serif); font-weight: 600; font-size: 38px; line-height: 1.15; letter-spacing: .02em; margin-top: 6px; overflow-wrap: anywhere; }
  .sub { margin-top: 8px; font-size: 14px; font-weight: 300; color: var(--dim); line-height: 1.6; }

  /* ---------- 卡片(使用與實體卡正面相同的擬真渲染圖) ---------- */
  .card-wrap { padding: 0 20px; margin-top: 20px; }
  .card-wrap.small { max-width: 280px; margin: 18px auto 0; padding: 0; width: 100%; }
  .card {
    position: relative; aspect-ratio: 85.6 / 54; border-radius: 3.715% / 5.89%; overflow: hidden;
    background: #151312;
    box-shadow: 0 22px 44px rgba(0, 0, 0, .6), 0 0 0 1px rgba(226, 180, 160, .28);
  }
  .card-img { display: block; width: 100%; height: 100%; object-fit: cover; -webkit-user-drag: none; user-select: none; }

  /* ---------- 面板 ---------- */
  .panel { margin: 16px 20px 0; padding: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; }
  .balance { display: flex; justify-content: space-between; align-items: center; gap: 14px; }
  .label { display: flex; align-items: center; gap: 4px; color: var(--dim); font-size: 14px; }
  .eye { width: 44px; height: 44px; margin: -12px -6px -12px 0; display: grid; place-items: center; background: none; border: 0; color: var(--muted); }
  .amount { display: flex; align-items: baseline; gap: 8px; margin-top: 2px; }
  .prefix { font-size: 14px; color: var(--dim); }
  .n { font-size: 36px; font-weight: 500; line-height: 1.2; letter-spacing: .01em; font-variant-numeric: tabular-nums; }
  .shop-btn {
    width: 78px; min-height: 76px; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    border: 1px solid var(--line); border-radius: 16px; background: var(--panel-2); color: var(--rose); font-size: 12px; line-height: 1.3; text-align: center;
  }
  .shop-btn:active { background: #26211F; }

  .sec-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .sec-head h2 { font-size: 15px; font-weight: 500; color: var(--dim); }
  .text-link { min-height: 44px; margin: -12px 0; padding: 0 2px; background: none; border: 0; color: var(--rose); font-size: 14px; }

  .quick-row { display: flex; justify-content: space-between; gap: 6px; }
  .q { flex: 1 1 0; min-width: 0; min-height: 44px; padding: 0; background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--dim); font-size: 12px; line-height: 1.35; }
  .q-circle {
    width: 56px; height: 56px; flex: none; border-radius: 50%; display: grid; place-items: center;
    border: 1px solid #3B312D; background: var(--panel-2); box-shadow: inset 0 0 0 1px rgba(226, 180, 160, .06);
  }
  .q-circle.sm { width: 48px; height: 48px; }
  .q-emoji { font-size: 24px; line-height: 1; filter: grayscale(1) sepia(.7) brightness(1.2); }
  .q-label { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-align: center; overflow-wrap: anywhere; }
  .q.dim .q-circle, .q.dim .q-label { opacity: .5; }

  /* ---------- 雙餘額 ---------- */
  .bal-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .pill-sm { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel-2); color: var(--rose); font-size: 13px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .pill-sm:active { background: #26211F; }
  .bal-cols { display: grid; grid-template-columns: 1.3fr 1fr; margin-top: 14px; }
  .bcol { min-width: 0; }
  .bcol + .bcol { padding-left: 18px; border-left: 1px solid var(--line); }
  .bname { font-size: 13px; color: var(--muted); }
  .bcol .n { font-size: 30px; }
  .pend { margin-top: 4px; font-size: 12px; color: var(--rose); }
  .cur-tag { margin-left: 8px; padding: 0 6px; border: 1px solid var(--line); border-radius: 5px; font-size: 11px; color: var(--dim); }
  .hint { margin: 10px 22px 0; font-size: 13px; color: var(--muted); line-height: 1.6; }

  /* ---------- 零錢包支出表單 ---------- */
  .spend { margin: 14px 20px 0; padding: 20px 18px 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; }
  .spend label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .spend .amt-row { display: flex; align-items: center; gap: 10px; padding: 0 14px; border: 1px solid var(--line); border-radius: 14px; background: #121010; }
  .spend .amt-row .pfx { color: var(--rose); font-size: 18px; white-space: nowrap; }
  .spend input { width: 100%; min-height: 52px; background: transparent; border: 0; color: var(--text); font: inherit; font-size: 26px; font-weight: 500; font-variant-numeric: tabular-nums; outline: none; }
  .spend input.item { min-height: 48px; padding: 0 14px; font-size: 16px; font-weight: 400; border: 1px solid var(--line); border-radius: 14px; background: #121010; }
  .spend input::placeholder { color: var(--muted); font-weight: 300; }
  .spend .amt-row:focus-within, .spend input.item:focus { border-color: var(--copper); }
  .spend .btn { width: 100%; margin-top: 18px; }
  .spend .gap { height: 16px; }

  /* ---------- 明細 ---------- */
  .rrow { display: grid; grid-template-columns: 1fr auto; gap: 14px; padding: 13px 0; border-bottom: 1px solid var(--line); align-items: start; }
  .rrow:last-child { border-bottom: 0; padding-bottom: 0; }
  .rrow:first-of-type { padding-top: 0; }
  .note { font-size: 15px; line-height: 1.55; overflow-wrap: anywhere; }
  .date { margin-top: 2px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .amt { text-align: right; font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .amt.in { color: var(--rose); }
  .amt.out { color: var(--dim); }
  .after { display: block; margin-top: 2px; font-size: 12px; font-weight: 400; color: var(--muted); }
  .empty { padding: 36px 24px; color: var(--muted); line-height: 1.7; font-size: 14px; }
  .list { margin: 8px 20px 0; }
  .list .rrow { padding: 15px 2px; }
  .list .rrow:first-of-type { padding-top: 15px; }
  .list .rrow:last-child { padding-bottom: 15px; border-bottom: 1px solid var(--line); }

  .seg { display: flex; gap: 4px; margin: 8px 20px 4px; padding: 4px; border: 1px solid var(--line); border-radius: 14px; background: #131110; }
  .seg button { flex: 1; min-height: 40px; border: 0; border-radius: 10px; background: none; color: var(--muted); font-size: 15px; }
  .seg button[aria-selected="true"] { background: var(--panel-2); color: var(--rose); font-weight: 500; }

  /* ---------- 兌換 ---------- */
  .item { display: grid; grid-template-columns: 48px 1fr auto; gap: 14px; align-items: center; padding: 16px 2px; border-bottom: 1px solid var(--line); }
  .item h3 { font-size: 16px; font-weight: 500; line-height: 1.4; }
  .item .desc { margin-top: 2px; font-size: 13px; font-weight: 300; color: var(--dim); line-height: 1.5; }
  .item .cost { margin-top: 4px; font-size: 14px; color: var(--rose); font-variant-numeric: tabular-nums; }
  .pill {
    min-height: 40px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--copper);
    background: transparent; color: var(--rose); font-size: 14px; font-weight: 500; white-space: nowrap;
  }
  .pill:active:not(:disabled) { background: var(--panel-2); }
  .pill:disabled { border-color: var(--line); color: var(--muted); font-weight: 400; }

  .rec { padding: 16px 2px; border-bottom: 1px solid var(--line); }
  .rec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .rec-title { font-size: 16px; font-weight: 500; line-height: 1.4; }
  .rec-cost { color: var(--rose); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .rec-meta { display: flex; align-items: center; gap: 10px; margin-top: 6px; font-size: 12px; color: var(--muted); }
  .chip { border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px; font-size: 12px; color: var(--dim); }
  .chip.pending { border-color: var(--copper); color: var(--rose); }
  .link-btn { margin-top: 2px; min-height: 44px; padding: 0; background: none; border: 0; color: var(--rose); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }

  /* ---------- 卡片頁 ---------- */
  .info { margin: 22px 20px 0; border: 1px solid var(--line); border-radius: 20px; background: var(--panel); }
  .info div { display: flex; justify-content: space-between; gap: 16px; padding: 16px 18px; border-bottom: 1px solid var(--line); font-size: 15px; }
  .info div:last-child { border-bottom: 0; }
  .info dt { color: var(--muted); }
  .info dd { color: var(--text); text-align: right; overflow-wrap: anywhere; }
  .center { display: flex; justify-content: center; margin-top: 22px; }

  /* ---------- 下方分頁 ---------- */
  .tabbar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: min(100%, 480px); z-index: 5;
    display: grid; grid-template-columns: repeat(4, 1fr);
    background: rgba(15, 14, 14, .94); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .tab { min-height: 62px; background: none; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--muted); font-size: 12px; }
  .tab[aria-selected="true"] { color: var(--rose); font-weight: 500; }

  /* ---------- 鎖定畫面 ---------- */
  .lock-head { padding: calc(env(safe-area-inset-top, 0px) + 28px) 22px 0; text-align: center; }
  .lock-head .hi { font-size: 34px; margin-top: 8px; text-transform: none; letter-spacing: .12em; }
  .lock-body { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px; padding: 22px 0 calc(22px + env(safe-area-inset-bottom, 0px)); text-align: center; }
  .prompt { font-size: 16px; color: var(--dim); }
  .dots { display: flex; justify-content: center; gap: 18px; }
  .dot { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid var(--copper); }
  .dot.on { background: var(--rose); border-color: var(--rose); }
  .dots.shake { animation: shake .4s; }
  .msg { min-height: 1.6em; padding: 0 22px; font-size: 14px; color: #E59A8C; line-height: 1.6; }
  .msg.soft { color: var(--muted); }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 0; width: 100%; max-width: 300px; margin: 0 auto; padding: 0 22px; }
  .key {
    width: 66px; height: 66px; justify-self: center; border-radius: 50%; display: grid; place-items: center;
    border: 1px solid var(--line); background: transparent; color: var(--text); font-size: 26px; font-weight: 300;
  }
  .key:active:not(:disabled) { background: var(--panel-2); border-color: var(--copper); }
  .key:disabled { opacity: .35; }
  .key.aux { border-color: transparent; color: var(--muted); }
  .waves { width: 56px; height: 56px; margin: 0 auto; color: var(--rose); }

  /* ---------- 底部彈出視窗 ---------- */
  .backdrop { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, .6); display: flex; align-items: flex-end; justify-content: center; animation: fade .18s ease-out; }
  .sheet {
    width: min(100%, 480px); background: #1A1716; border-top: 1px solid var(--line); border-radius: 22px 22px 0 0;
    padding: 26px 22px calc(22px + env(safe-area-inset-bottom, 0px)); animation: rise .22s ease-out;
  }
  .sheet h2 { font-size: 20px; font-weight: 500; line-height: 1.4; }
  .sheet p { margin-top: 10px; line-height: 1.7; color: var(--dim); font-size: 15px; }
  .sheet textarea, .sheet input {
    width: 100%; margin-top: 14px; padding: 12px; font: inherit; font-size: 16px; line-height: 1.6;
    border: 1px solid var(--line); border-radius: 12px; background: #121010; color: var(--text); resize: none;
  }
  .sheet textarea::placeholder, .sheet input::placeholder { color: var(--muted); }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 22px; }
  .btn { min-height: 48px; border-radius: 12px; border: 1px solid var(--copper); background: linear-gradient(180deg, #EBC5B3, #C98F78); color: #1A1210; font-weight: 700; font-size: 16px; }
  .btn.ghost { background: transparent; color: var(--rose); font-weight: 500; }
  .btn:disabled { opacity: .5; }

  /* ---------- 印章與提示 ---------- */
  .seal-wrap { position: fixed; inset: 0; z-index: 30; display: grid; place-content: center; justify-items: center; gap: 26px; background: rgba(10, 9, 9, .92); text-align: center; padding: 24px; }
  .seal {
    color: var(--rose); border: 3px solid var(--rose); border-radius: 12px; padding: 14px 24px 14px 30px;
    font-family: var(--serif); font-weight: 600; font-size: 44px; letter-spacing: .14em;
    box-shadow: inset 0 0 0 5px #0F0E0E, inset 0 0 0 6px var(--copper), 0 0 40px rgba(226, 180, 160, .25);
    transform: rotate(-7deg); animation: stamp .42s cubic-bezier(.2, 1.35, .4, 1) both;
  }
  .seal-title { font-size: 20px; font-weight: 500; line-height: 1.5; }
  .seal-bal { margin-top: 4px; color: var(--muted); font-size: 15px; }
  .toast {
    position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40;
    max-width: min(90vw, 420px); padding: 12px 18px; border-radius: 12px; border: 1px solid var(--line);
    background: #26211F; color: var(--text); font-size: 15px; line-height: 1.5; text-align: center;
  }

  @keyframes fade { from { opacity: 0; } }
  @keyframes rise { from { transform: translateY(40px); opacity: .6; } }
  @keyframes stamp { from { transform: rotate(-22deg) scale(2.3); opacity: 0; } to { transform: rotate(-7deg) scale(1); opacity: 1; } }
  @keyframes shake { 20% { transform: translateX(-9px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main id="app"></main>
<div id="sheet-root"></div>
<div id="seal-root"></div>
<div id="toast-root" role="status" aria-live="polite"></div>

<script>
/* 開機保護:頁面出錯時,把錯誤文字顯示在畫面上,而不是一片黑。這段獨立於主程式,主程式語法錯誤時也會生效 */
(function () {
  function show(msg) {
    var app = document.getElementById('app');
    if (!app || (window.__lbBooted && app.innerHTML.replace(/\s/g, ''))) return;
    var safe = String(msg).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; });
    app.innerHTML = '<div style="max-width:480px;margin:0 auto;padding:36px 22px;color:#F2ECE8;font:15px/1.7 system-ui,sans-serif">'
      + '<p style="color:#E59A8C;font-size:18px;margin-bottom:10px">頁面載入出錯了</p>'
      + '<p style="color:#CFC6C0">請把下面這段文字截圖或複製給我:</p>'
      + '<pre style="white-space:pre-wrap;word-break:break-all;margin-top:12px;padding:12px;border:1px solid #2A2523;border-radius:12px;background:#161413;color:#F2ECE8;font-size:13px">' + safe + '</pre></div>';
  }
  window.addEventListener('error', function (e) {
    show((e.message || 'error') + (e.filename ? '\n位置:' + String(e.filename).split('/').pop() + ' 第 ' + e.lineno + ' 行 第 ' + e.colno + ' 欄' : '') + '\n' + navigator.userAgent);
  });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason; show('Promise 錯誤:' + (r && (r.stack || r.message) || r) + '\n' + navigator.userAgent);
  });
  setTimeout(function () {
    if (!window.__lbBooted) show('頁面程式沒有啟動。可能是瀏覽器太舊,或檔案上傳不完整(請確認檔案大小約 200 KB)。\n' + navigator.userAgent);
  }, 5000);
})();
</script>

/* =========================================================
   與 Supabase 溝通(只呼叫四支 RPC,不直接碰資料表)
   ========================================================= */
async function rpc(fn, args) {
  const key = CONFIG.SUPABASE_ANON_KEY;
  const headers = { 'Content-Type': 'application/json', apikey: key };
  if (key.startsWith('eyJ')) headers.Authorization = `Bearer ${key}`; // 舊版 anon key 是 JWT;新版 publishable key 只用 apikey
  const res = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/rpc/${fn}`, { method: 'POST', headers, body: JSON.stringify(args) });
  const data = await res.json().catch(() => null);
  if (!res.ok) {
    const err = new Error(data?.message || 'request_failed');
    err.code = data?.message || 'request_failed';
    throw err;
  }
  return data;
}

const state = {
  token: null, session: null, data: null,
  tab: 'home', recTab: 'ledger', shopCur: 'heart', hideBal: CONFIG.HIDE_BALANCE_DEFAULT,
  pin: '', busy: false, error: '', lockUntil: 0, shake: false,
  loading: false, loadError: false, sheet: null
};

function init() {
  window.__lbBooted = true;
  document.title = CONFIG.BANK_NAME;
  const m = location.hash.match(/[#&]t=([0-9a-fA-F]+)/);
  if (m) {
    // 每次刷卡都視為新的一次登入:存下 token、清掉舊 session、把 token 從網址列移除
    store.set('lb_token', m[1].toLowerCase());
    store.del('lb_session');
    if (location.protocol !== 'file:') {
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    }
  }
  state.token = store.get('lb_token');
  state.session = store.get('lb_session');
  if (state.session) loadDashboard(); else render();
}

/* =========================================================
   畫面
   ========================================================= */
function render() {
  const app = $('#app');
  if (state.loading) app.innerHTML = viewLoading();
  else if (state.loadError) app.innerHTML = viewRetry();
  else if (state.session && state.data) app.innerHTML = viewHome();
  else app.innerHTML = viewLock();
  updateTimers();
}

function cardHtml() {
  return `<div class="card"><img class="card-img" src="${CARD_IMG}" alt="Dennis Bank 卡片" draggable="false"></div>`;
}

function viewLoading() {
  return `<div class="screen"><div class="lock-head"><p class="hi">${esc(CONFIG.BANK_NAME)}</p></div><p class="empty" style="text-align:center">讀取中…</p></div>`;
}

function viewRetry() {
  return `<div class="screen"><div class="lock-head"><p class="hi">${esc(CONFIG.BANK_NAME)}</p></div>
    <div class="empty" style="text-align:center"><p>暫時連不上,請確認網路後再試一次。</p><p style="margin-top:18px"><button class="pill" data-action="retry">重新讀取</button></p></div></div>`;
}

/* ---------- 鎖定 ---------- */
function viewLock() {
  const head = `<div class="lock-head"><p class="gm">WELCOME BACK</p><h1 class="hi">${esc(CONFIG.BANK_NAME)}</h1></div>
    <div class="card-wrap small">${cardHtml('')}</div>`;

  if (!state.token && !CONFIG.ALLOW_PIN_ONLY) {
    return `<div class="screen">${head}
      <div class="lock-body">
        <svg class="waves" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true">${ICON.nfc}</svg>
        <p class="prompt">請用卡片感應手機</p>
        <p class="msg soft">${esc(state.error) || '把卡片貼近 iPhone 上方,出現通知後點一下。'}</p>
        ${CONFIG.ALLOW_MANUAL_TOKEN ? `<button class="link-btn" style="margin:0 auto" data-action="ask-token">沒有卡片?輸入卡片代碼</button>` : ''}
      </div></div>`;
  }

  const locked = state.lockUntil > Date.now();
  const left = Math.ceil((state.lockUntil - Date.now()) / 1000);
  const dots = [0, 1, 2, 3].map((i) => `<span class="dot ${i < state.pin.length ? 'on' : ''}"></span>`).join('');
  const dis = state.busy || locked ? 'disabled' : '';
  const num = (k) => `<button class="key" data-action="key" data-v="${k}" ${dis}>${k}</button>`;
  const back = `<button class="key aux" data-action="back" aria-label="刪除一碼" ${dis}>${icon('back', 26)}</button>`;
  return `<div class="screen">${head}
    <div class="lock-body">
      <p class="prompt">請輸入 4 位數 PIN</p>
      <div class="dots ${state.shake ? 'shake' : ''}" aria-label="已輸入 ${state.pin.length} 碼">${dots}</div>
      <p class="msg" id="msg">${esc(locked ? lockText(left) : state.error)}</p>
      <div class="pad">${['1','2','3','4','5','6','7','8','9'].map(num).join('')}<span></span>${num('0')}${back}</div>
    </div></div>`;
}

/* ---------- 已登入 ---------- */
function withRunning(ledger, d) {
  const run = { heart: Number(bals(d).heart), wallet: Number(bals(d).wallet) };
  return ledger.map((r) => {
    const c = r.currency || 'heart';
    const out = { ...r, currency: c, after: run[c] };
    run[c] -= r.amount;
    return out;
  });
}

function topbar(title) {
  return `<header class="topbar"><span class="top-title">${esc(title || '')}</span>
    <div class="top-actions">
      <button class="icon-btn" data-action="refresh" aria-label="重新整理">${icon('refresh', 20)}</button>
      <button class="icon-btn" data-action="lock" aria-label="上鎖">${icon('lock', 20)}</button>
    </div></header>`;
}

function ledgerRow(r, showAfter) {
  const cur = r.currency || 'heart';
  const amt = cur === 'wallet' ? `${CONFIG.WALLET_PREFIX} ${fmt(Math.abs(r.amount))}` : `${fmt(Math.abs(r.amount))} ${CONFIG.UNIT}`;
  return `<div class="rrow">
    <div><p class="note">${esc(r.note || '入帳')}</p><p class="date">${fmtDate(r.created_at)}<span class="cur-tag">${esc(cur === 'wallet' ? CONFIG.WALLET_NAME : CONFIG.UNIT)}</span></p></div>
    <p class="amt ${r.amount > 0 ? 'in' : 'out'}">${r.amount > 0 ? '+' : '−'}${amt}${showAfter ? `<span class="after">結餘 ${masked() ? MASK : money(cur, r.after)}</span>` : ''}</p>
  </div>`;
}

function tabHome(d) {
  const b = bals(d);
  const wal = state.hideBal ? MASK : fmt(b.wallet);
  const hea = state.hideBal ? MASK : fmt(b.heart);
  const pick = (cur) => d.rewards.filter((r) => (r.currency || 'heart') === cur).slice(0, 5);
  const quick = (title, cur) => {
    const list = pick(cur);
    if (!list.length) return '';
    const items = list.map((r) => `<button class="q ${availOf(d, cur) < r.cost ? 'dim' : ''}" data-action="ask-redeem" data-id="${esc(r.id)}">
      <span class="q-circle"><span class="q-emoji">${esc(r.emoji || '🎁')}</span></span><span class="q-label">${esc(r.title)}</span></button>`).join('');
    return `<section class="panel"><div class="sec-head"><h2>${title}</h2><button class="text-link" data-action="shop-cur" data-v="${cur}">全部</button></div><div class="quick-row">${items}</div></section>`;
  };
  const recent = withRunning(d.ledger, d).slice(0, 3);
  return `${topbar('')}
    <section class="hello">
      <p class="gm">${greeting()}</p>
      <h1 class="hi">Hi, ${esc(nameOf(d))}</h1>
      <p class="sub">${esc(CONFIG.SUBTITLE)}</p>
    </section>
    <div class="card-wrap">${cardHtml()}</div>
    <section class="panel">
      <div class="bal-head">
        <p class="label">可用餘額<button class="eye" data-action="toggle-bal" aria-label="${state.hideBal ? '顯示餘額' : '隱藏餘額'}">${icon(state.hideBal ? 'eyeoff' : 'eye', 20)}</button></p>
        <button class="pill-sm" data-action="tab" data-v="shop">${icon('gift', 18)}<span>前往商店</span></button>
      </div>
      <div class="bal-cols">
        <div class="bcol"><p class="bname">${esc(CONFIG.WALLET_NAME)}</p>
          <p class="amount"><span class="prefix">${esc(CONFIG.WALLET_PREFIX)}</span><span class="n">${wal}</span></p>
          ${d.wallet_pending > 0 ? `<p class="pend">待扣款 ${esc(CONFIG.WALLET_PREFIX)} ${fmt(d.wallet_pending)}</p>` : ''}</div>
        <div class="bcol"><p class="bname">${esc(CONFIG.UNIT)}</p>
          <p class="amount"><span class="n">${hea}</span></p></div>
      </div>
    </section>
    ${quick(esc(CONFIG.UNIT) + '兌換', 'heart')}
    <section class="panel"><div class="sec-head"><h2>最近明細</h2><button class="text-link" data-action="tab" data-v="records">查看全部</button></div>
      ${recent.length ? recent.map((r) => ledgerRow(r, false)).join('') : `<p class="empty" style="padding:8px 0">還沒有任何紀錄。有新的入帳時,會出現在這裡。</p>`}
    </section>`;
}

function tabShop(d) {
  const cur = state.shopCur;
  const seg = `<div class="seg" role="tablist">
    <button role="tab" aria-selected="${cur === 'heart'}" data-action="shop-cur" data-v="heart">${esc(CONFIG.UNIT)}兌換</button>
    <button role="tab" aria-selected="${cur === 'wallet'}" data-action="shop-cur" data-v="wallet">${esc(CONFIG.WALLET_NAME)}</button></div>`;
  const avail = availOf(d, cur);

  if (cur === 'wallet') {
    const pending = d.wallet_mode === 'pending';
    const hint = pending
      ? `可用 ${masked() ? MASK : money('wallet', avail)}。送出後會先通知${esc(CONFIG.PARTNER)},等${esc(CONFIG.PARTNER)}確認並扣款才算完成。`
      : `可用 ${masked() ? MASK : money('wallet', avail)}。送出後會立刻從${esc(CONFIG.WALLET_NAME)}扣款,並通知${esc(CONFIG.PARTNER)}。`;
    const recent = d.redemptions.filter((r) => r.currency === 'wallet').slice(0, 5);
    return `${topbar('商店')}${seg}<p class="hint">${hint}</p>
      <section class="spend">
        <label for="spend-amount">金額</label>
        <div class="amt-row"><span class="pfx">${esc(CONFIG.WALLET_PREFIX)}</span>
          <input id="spend-amount" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="0" maxlength="9" aria-label="金額"></div>
        <div class="gap"></div>
        <label for="spend-item">項目明細(選填)</label>
        <input class="item" id="spend-item" type="text" autocomplete="off" maxlength="60" placeholder="例如:手搖飲、電影票">
        <button class="btn" data-action="ask-spend">${pending ? '送出' : '確認支出'}</button>
      </section>
      ${recent.length ? `<div class="sec-head" style="margin:22px 22px 0"><h2 style="font-size:15px;font-weight:500;color:var(--dim)">最近的零錢包支出</h2></div>
        <div class="list">${recent.map((r) => `<div class="rrow"><div><p class="note">${esc(r.reward_title)}</p><p class="date">${fmtDate(r.created_at)}<span class="cur-tag">${esc(statusText(r))}</span></p></div>
          <p class="amt out">−${money('wallet', r.cost)}</p></div>`).join('')}</div>` : ''}`;
  }

  const list = d.rewards.filter((r) => (r.currency || 'heart') === 'heart');
  const items = list.length
    ? list.map((r) => {
        const short = avail < r.cost;
        return `<div class="item">
          <span class="q-circle sm"><span class="q-emoji">${esc(r.emoji || '🎁')}</span></span>
          <div><h3>${esc(r.title)}</h3>${r.description ? `<p class="desc">${esc(r.description)}</p>` : ''}<p class="cost">${money('heart', r.cost)}</p></div>
          <button class="pill" data-action="ask-redeem" data-id="${esc(r.id)}" ${short ? 'disabled' : ''}>${short ? (masked() ? '餘額不足' : `還差 ${fmt(r.cost - avail)}`) : '兌換'}</button>
        </div>`;
      }).join('')
    : `<p class="empty">這個商店暫時沒有商品。</p>`;
  return `${topbar('商店')}${seg}<p class="hint">愛心可用 ${masked() ? MASK : money('heart', avail)}。兌換後會立刻扣款。</p><div class="list">${items}</div>`;
}

function tabRecords(d) {
  const seg = `<div class="seg" role="tablist">
    <button role="tab" aria-selected="${state.recTab === 'ledger'}" data-action="rec-tab" data-v="ledger">餘額明細</button>
    <button role="tab" aria-selected="${state.recTab === 'redeem'}" data-action="rec-tab" data-v="redeem">兌換與購買</button></div>`;
  let body;
  if (state.recTab === 'ledger') {
    const rows = withRunning(d.ledger, d);
    body = rows.length ? `<div class="list">${rows.map((r) => ledgerRow(r, true)).join('')}</div>`
      : `<p class="empty">還沒有任何紀錄。有新的入帳時,會出現在這裡。</p>`;
  } else {
    body = d.redemptions.length
      ? `<div class="list">${d.redemptions.map((r) => {
          const cur = r.currency || 'heart';
          const waiting = r.status === 'refund_requested' || r.status === 'pending';
          return `<div class="rec">
          <div class="rec-head"><span class="rec-title">${esc(r.reward_title)}</span><span class="rec-cost">${money(cur, r.cost)}</span></div>
          <div class="rec-meta"><span>${fmtDate(r.created_at)}</span><span class="chip ${waiting ? 'pending' : ''}">${esc(statusText({ ...r, currency: cur }))}</span></div>
          ${r.status === 'completed' && cur === 'heart' ? `<button class="link-btn" data-action="ask-refund" data-id="${esc(r.id)}">申請退款</button>` : ''}
        </div>`;
        }).join('')}</div>`
      : `<p class="empty">還沒有兌換或購買過任何項目。到「商店」看看吧。</p>`;
  }
  return `${topbar('紀錄')}${seg}${body}`;
}

function tabCard(d) {
  return `${topbar('卡片')}
    <div class="card-wrap">${cardHtml()}</div>
    <dl class="info">
      <div><dt>持卡人</dt><dd>${esc(nameOf(d))}</dd></div>
      <div><dt>帳戶</dt><dd>${esc(CONFIG.BANK_NAME)}</dd></div>
      <div><dt>登入方式</dt><dd>感應卡片加 PIN</dd></div>
    </dl>
    <div class="center"><button class="pill" data-action="lock">上鎖</button></div>`;
}

function viewHome() {
  const d = state.data;
  const body = state.tab === 'shop' ? tabShop(d) : state.tab === 'records' ? tabRecords(d) : state.tab === 'card' ? tabCard(d) : tabHome(d);
  const tab = (id, label, ic) => `<button class="tab" role="tab" aria-selected="${state.tab === id}" data-action="tab" data-v="${id}">${icon(ic, 24)}<span>${label}</span></button>`;
  return `<div class="screen"><div class="page">${body}</div>
    <nav class="tabbar" role="tablist" aria-label="主選單">${tab('home', '首頁', 'home')}${tab('shop', '商店', 'gift')}${tab('records', '紀錄', 'list')}${tab('card', '卡片', 'card')}</nav></div>`;
}

/* ---------- 彈出視窗 ---------- */
function renderSheet() {
  const root = $('#sheet-root');
  const s = state.sheet;
  if (!s) { root.innerHTML = ''; return; }
  const dis = state.busy ? 'disabled' : '';
  const open = `<div class="backdrop" data-action="close-sheet"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t" tabindex="-1" data-stop>`;
  if (s.type === 'redeem') {
    const after = availOf(state.data, 'heart') - s.reward.cost;
    root.innerHTML = `${open}
      <h2 id="sh-t">兌換「${esc(s.reward.title)}」?</h2>
      <p>會花掉 ${fmt(s.reward.cost)} ${esc(CONFIG.UNIT)}${masked() ? '' : `,剩下 ${fmt(after)} ${esc(CONFIG.UNIT)}`}。兌換後${esc(CONFIG.PARTNER)}會馬上收到通知。</p>
      <div class="actions"><button class="btn ghost" data-action="close-sheet" ${dis}>取消</button><button class="btn" data-action="confirm-redeem" ${dis}>${state.busy ? '處理中…' : '確定兌換'}</button></div>
    </div></div>`;
  } else if (s.type === 'spend') {
    const pending = state.data.wallet_mode === 'pending';
    const after = availOf(state.data, 'wallet') - s.amount;
    root.innerHTML = `${open}
      <h2 id="sh-t">${pending ? '送出' : '確認'}支出 ${money('wallet', s.amount)}?</h2>
      <p>項目:${esc(s.item || '零錢包支出')}。${pending
        ? `送出後會先通知${esc(CONFIG.PARTNER)},等${esc(CONFIG.PARTNER)}確認並扣款才算完成。${masked() ? '' : `送出後可用額度剩 ${money('wallet', after)}。`}`
        : `會立刻從${esc(CONFIG.WALLET_NAME)}扣款${masked() ? '' : `,扣完剩 ${money('wallet', after)}`},並通知${esc(CONFIG.PARTNER)}。`}</p>
      <div class="actions"><button class="btn ghost" data-action="close-sheet" ${dis}>取消</button><button class="btn" data-action="confirm-spend" ${dis}>${state.busy ? '處理中…' : (pending ? '送出' : '確認支出')}</button></div>
    </div></div>`;
  } else if (s.type === 'purchase') {
    const after = availOf(state.data, 'wallet') - s.reward.cost;
    root.innerHTML = `${open}
      <h2 id="sh-t">購買「${esc(s.reward.title)}」?</h2>
      <p>價格 ${money('wallet', s.reward.cost)}。送出後會先通知${esc(CONFIG.PARTNER)},等${esc(CONFIG.PARTNER)}確認並扣款才算完成,這時零錢包還不會變少。${masked() ? '' : `送出後可用額度剩 ${money('wallet', after)}。`}</p>
      <div class="actions"><button class="btn ghost" data-action="close-sheet" ${dis}>取消</button><button class="btn" data-action="confirm-purchase" ${dis}>${state.busy ? '送出中…' : '送出購買'}</button></div>
    </div></div>`;
  } else if (s.type === 'refund') {
    root.innerHTML = `${open}
      <h2 id="sh-t">申請退款「${esc(s.redemption.reward_title)}」</h2>
      <p>送出後要等${esc(CONFIG.PARTNER)}審核,通過後 ${fmt(s.redemption.cost)} ${esc(CONFIG.UNIT)} 會回到餘額。</p>
      <textarea id="refund-reason" rows="3" maxlength="200" placeholder="想說的話(選填)" aria-label="退款理由,選填"></textarea>
      <div class="actions"><button class="btn ghost" data-action="close-sheet" ${dis}>取消</button><button class="btn" data-action="confirm-refund" ${dis}>${state.busy ? '送出中…' : '送出申請'}</button></div>
    </div></div>`;
  } else if (s.type === 'token') {
    root.innerHTML = `${open}
      <h2 id="sh-t">輸入卡片代碼</h2>
      <p>測試用。貼上卡片網址裡 t= 後面的那一串,或整個網址都可以。</p>
      <input id="token-input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="卡片代碼">
      <p class="msg" id="token-msg" style="padding:0;text-align:left" role="alert"></p>
      <div class="actions"><button class="btn ghost" data-action="close-sheet">取消</button><button class="btn" data-action="confirm-token">確定</button></div>
    </div></div>`;
  }
  const sheet = root.querySelector('.sheet');
  if (sheet) sheet.focus();
}

function showSeal(label, title, sub) {
  const root = $('#seal-root');
  root.innerHTML = `<div class="seal-wrap" data-action="close-seal" role="alertdialog" aria-label="${esc(label)}">
    <div class="seal">${esc(label)}</div>
    <div><p class="seal-title">${esc(title)}</p><p class="seal-bal">${esc(sub)}</p></div></div>`;
  clearTimeout(showSeal.t);
  showSeal.t = setTimeout(() => { root.innerHTML = ''; }, 2600);
}

function toast(text) {
  const root = $('#toast-root');
  root.innerHTML = `<div class="toast">${esc(text)}</div>`;
  clearTimeout(toast.t);
  toast.t = setTimeout(() => { root.innerHTML = ''; }, 3200);
}

/* =========================================================
   動作
   ========================================================= */
function lockText(s) {
  return `輸錯太多次,已暫時鎖定。${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')} 後可以再試`;
}

let lockTimer = null;
function updateTimers() {
  clearInterval(lockTimer);
  if (state.lockUntil > Date.now() && !state.session) {
    lockTimer = setInterval(() => {
      const left = Math.ceil((state.lockUntil - Date.now()) / 1000);
      if (left <= 0) { clearInterval(lockTimer); state.lockUntil = 0; state.error = ''; render(); return; }
      const el = document.getElementById('msg');
      if (el) el.textContent = lockText(left);
    }, 1000);
  }
}

function lockNow(message) {
  state.session = null; state.data = null; state.pin = ''; state.sheet = null;
  state.tab = 'home'; state.recTab = 'ledger'; state.hideBal = CONFIG.HIDE_BALANCE_DEFAULT;
  state.error = message || '';
  store.del('lb_session');
  renderSheet();
  render();
  window.scrollTo(0, 0);
}

function pressKey(v) {
  if (state.busy || state.lockUntil > Date.now() || state.pin.length >= 4) return;
  state.pin += v;
  state.error = ''; state.shake = false;
  render();
  if (state.pin.length === 4) submitPin();
}

async function submitPin() {
  state.busy = true; render();
  try {
    const r = await rpc('unlock', { p_token: state.token || '', p_pin: state.pin });
    state.pin = '';
    if (r.ok) {
      state.session = r.session;
      store.set('lb_session', r.session);
      state.tab = 'home';
      state.busy = false;
      await loadDashboard();
      return;
    }
    if (r.error === 'locked') {
      state.lockUntil = Date.now() + (r.retry_after_seconds || 900) * 1000;
      state.error = '';
    } else if (r.error === 'wrong_pin') {
      state.error = `PIN 不對,還可以再試 ${r.attempts_left} 次`;
      state.shake = true;
    } else {
      state.error = CONFIG.ALLOW_PIN_ONLY ? '還沒啟用「只要 PIN」登入,請先在資料庫執行 love-bank-pin-only.sql' : '這張卡片已經失效了';
      store.del('lb_token'); state.token = null;
    }
  } catch {
    state.pin = '';
    state.error = '連線失敗,請再試一次';
  }
  state.busy = false;
  render();
}

async function loadDashboard(silent) {
  if (!silent) { state.loading = true; state.loadError = false; render(); }
  try {
    const dd = await rpc('get_dashboard', { p_session: state.session });
    dd.balances = dd.balances || { heart: dd.balance || 0, wallet: 0 };
    dd.wallet_pending = dd.wallet_pending || 0;
    dd.wallet_mode = dd.wallet_mode || 'instant';
    state.data = dd;
    state.loading = false; state.loadError = false;
    render();
    return true;
  } catch (e) {
    state.loading = false;
    if (e.code === 'session_expired') { lockNow('登入已過期,請重新輸入 PIN'); return false; }
    if (silent) { toast('更新失敗,請稍後再試'); return false; }
    state.loadError = true; render();
    return false;
  }
}

async function doRedeem() {
  if (state.busy || !state.sheet) return;
  const reward = state.sheet.reward;
  state.busy = true; renderSheet();
  try {
    const r = await rpc('redeem', { p_session: state.session, p_reward_id: reward.id });
    state.busy = false; state.sheet = null; renderSheet();
    if (r.ok) showSeal('已兌換', reward.title, masked() ? '' : `剩餘 ${fmt(r.balance)} ${CONFIG.UNIT}`); else toast(ERR_TEXT[r.error] || '兌換失敗,請再試一次');
    await loadDashboard(true);
  } catch (e) {
    state.busy = false; state.sheet = null; renderSheet();
    if (e.code === 'session_expired') lockNow('登入已過期,請重新輸入 PIN'); else toast('連線失敗,請再試一次');
  }
}

async function doSpend() {
  if (state.busy || !state.sheet) return;
  const { amount, item } = state.sheet;
  state.busy = true; renderSheet();
  try {
    const r = await rpc('spend', { p_session: state.session, p_amount: amount, p_item: item || null });
    state.busy = false; state.sheet = null; renderSheet();
    if (r.ok && r.pending) showSeal('已送出', item || '零錢包支出', `等待${CONFIG.PARTNER}確認並扣款`);
    else if (r.ok) showSeal('已扣款', item || '零錢包支出', masked() ? '' : `剩餘 ${money('wallet', r.balance)}`);
    else toast(ERR_TEXT[r.error] || '送出失敗,請再試一次');
    await loadDashboard(true);
  } catch (e) {
    state.busy = false; state.sheet = null; renderSheet();
    if (e.code === 'session_expired') lockNow('登入已過期,請重新輸入 PIN');
    else if (/Could not find the function/i.test(e.message || '')) toast('資料庫還沒更新,請先執行 love-bank-wallet-spend.sql');
    else toast('連線失敗,請再試一次');
  }
}

async function doPurchase() {
  if (state.busy || !state.sheet) return;
  const reward = state.sheet.reward;
  state.busy = true; renderSheet();
  try {
    const r = await rpc('purchase', { p_session: state.session, p_reward_id: reward.id });
    state.busy = false; state.sheet = null; renderSheet();
    if (r.ok) showSeal('已送出', reward.title, `等待${CONFIG.PARTNER}確認並扣款`); else toast(ERR_TEXT[r.error] || '送出失敗,請再試一次');
    await loadDashboard(true);
  } catch (e) {
    state.busy = false; state.sheet = null; renderSheet();
    if (e.code === 'session_expired') lockNow('登入已過期,請重新輸入 PIN'); else toast('連線失敗,請再試一次');
  }
}

async function doRefund() {
  if (state.busy || !state.sheet) return;
  const red = state.sheet.redemption;
  const reason = (document.getElementById('refund-reason')?.value || '').trim();
  state.busy = true; renderSheet();
  try {
    const r = await rpc('request_refund', { p_session: state.session, p_redemption_id: red.id, p_reason: reason || null });
    state.busy = false; state.sheet = null; renderSheet();
    toast(r.ok ? `已送出退款申請,等待${CONFIG.PARTNER}審核` : (ERR_TEXT[r.error] || '送出失敗,請再試一次'));
    await loadDashboard(true);
  } catch (e) {
    state.busy = false; state.sheet = null; renderSheet();
    if (e.code === 'session_expired') lockNow('登入已過期,請重新輸入 PIN'); else toast('連線失敗,請再試一次');
  }
}

/* =========================================================
   事件
   ========================================================= */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  // 點在彈出視窗內容上不要關閉(只有點背景才關)
  if (el.dataset.action === 'close-sheet' && el.classList.contains('backdrop') && e.target.closest('[data-stop]')) return;

  switch (el.dataset.action) {
    case 'key': pressKey(el.dataset.v); break;
    case 'back': if (!state.busy && state.pin) { state.pin = state.pin.slice(0, -1); state.error = ''; render(); } break;
    case 'tab': state.tab = el.dataset.v; render(); window.scrollTo(0, 0); break;
    case 'rec-tab': state.recTab = el.dataset.v; render(); break;
    case 'toggle-bal': state.hideBal = !state.hideBal; render(); break;
    case 'refresh': loadDashboard(true).then((ok) => { if (ok) toast('已更新'); }); break;
    case 'lock': lockNow(); break;
    case 'retry': loadDashboard(); break;
    case 'ask-redeem': {
      const reward = state.data.rewards.find((r) => r.id === el.dataset.id);
      if (!reward) break;
      const cur = reward.currency || 'heart';
      const avail = availOf(state.data, cur);
      if (avail < reward.cost) { toast(masked() ? '餘額不足' : `還差 ${money(cur, reward.cost - avail)}`); break; }
      state.sheet = { type: cur === 'wallet' ? 'purchase' : 'redeem', reward }; renderSheet();
      break;
    }
    case 'ask-refund': {
      const redemption = state.data.redemptions.find((r) => r.id === el.dataset.id);
      if (redemption) { state.sheet = { type: 'refund', redemption }; renderSheet(); }
      break;
    }
    case 'confirm-redeem': doRedeem(); break;
    case 'confirm-purchase': doPurchase(); break;
    case 'ask-spend': {
      const amount = parseInt((document.getElementById('spend-amount')?.value || '').replace(/[^0-9]/g, ''), 10);
      const item = (document.getElementById('spend-item')?.value || '').trim();
      if (!amount || amount <= 0) { toast(ERR_TEXT.invalid_amount); break; }
      const avail = availOf(state.data, 'wallet');
      if (amount > avail) { toast(masked() ? '超過可用額度' : `超過可用額度,還差 ${money('wallet', amount - avail)}`); break; }
      state.sheet = { type: 'spend', amount, item }; renderSheet();
      break;
    }
    case 'confirm-spend': doSpend(); break;
    case 'shop-cur': state.shopCur = el.dataset.v; state.tab = 'shop'; render(); window.scrollTo(0, 0); break;
    case 'confirm-refund': doRefund(); break;
    case 'ask-token':
      if (CONFIG.ALLOW_MANUAL_TOKEN) { state.sheet = { type: 'token' }; renderSheet(); }
      break;
    case 'confirm-token': {
      if (!CONFIG.ALLOW_MANUAL_TOKEN) break;
      const raw = document.getElementById('token-input')?.value || '';
      const found = raw.match(/[0-9a-fA-F]{32,}/); // 容許前後有引號、空白、換行,或貼了整個網址
      const v = found ? found[0].toLowerCase() : '';
      if (!v) {
        document.getElementById('token-msg').textContent = '代碼格式不對,請貼上完整那串英數字';
        break;
      }
      store.set('lb_token', v);
      state.token = v; state.error = ''; state.sheet = null;
      renderSheet(); render();
      break;
    }
    case 'close-sheet': if (!state.busy) { state.sheet = null; renderSheet(); } break;
    case 'close-seal': $('#seal-root').innerHTML = ''; break;
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && state.sheet && !state.busy) { state.sheet = null; renderSheet(); }
});

// 離開頁面太久,回來要重新輸入 PIN
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (state.session && hiddenAt && Date.now() - hiddenAt > CONFIG.AUTO_LOCK_MINUTES * 60000) {
    lockNow('已自動上鎖,請重新輸入 PIN');
  }
});

init();
</script>
